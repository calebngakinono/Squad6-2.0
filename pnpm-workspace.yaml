packages:
  - apps/*
  - packages/*

allowBuilds:
  sharp: false
  unrs-resolver: false

# Force patched versions of vulnerable transitive dev-tool dependencies (pnpm audit).
# Remove an entry once the upstream package ships the fix itself.
overrides:
  zod@<4.6.6: ^4.6.6
  minimatch@<11.0.1: ^11.0.1

# The HealthKit library's Expo config plugin imports @expo/config-plugins without declaring it, which
# pnpm's strict layout hides (expo config / EAS build then fail). Remove once upstream declares it.
packageExtensions:
  "@kingstinct/react-native-healthkit":
    dependencies:
      "@expo/config-plugins": "*"
  "@react-native-healthkit/core":
    dependencies:
      "@expo/config-plugins": "*"
